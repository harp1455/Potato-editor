# 새 버전 내기: src-tauri/tauri.conf.json의 version을 올려 main에 올리면, 그 버전(v8.0.1 등) 릴리스가 아직 없을 때
# 윈도우 설치 파일과 HTML판을 만들어 릴리스에 올려요. 설치된 감자 편집기는 최신 릴리스의 latest.json을 보고 업데이트해요
name: release
on:
  push:
    branches: [main]
    paths: ['src-tauri/tauri.conf.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="v$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "$tag 릴리스가 이미 있어요"; fi
  windows:
    needs: check
    if: needs.check.outputs.skip != '1'
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: 업데이트 서명 키 확인
        id: key
        shell: bash
        env:
          K: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$K" ]; then echo "args=" >> "$GITHUB_OUTPUT"; else echo "args=--config src-tauri/nosign.json" >> "$GITHUB_OUTPUT"; echo "::warning::서명 키(TAURI_SIGNING_PRIVATE_KEY)가 없어서 자동 업데이트 파일 없이 만들어요"; fi
      - name: 릴리스 설명
        id: notes
        shell: bash
        run: |
          { echo 'body<<NOTES_EOF'; cat release-notes.md; echo; echo 'NOTES_EOF'; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ needs.check.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseName: 감자 편집기 ${{ needs.check.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          assetNamePattern: PotatoEditor_[version]_[arch][setup][ext]
          args: ${{ steps.key.outputs.args }}
  html:
    needs: [check, windows]
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 팩 받기
        run: |
          tag=$(grep -oE "CZ_PACK_TAG = '[^']+'" src/cz.js | cut -d"'" -f2)
          gh release download "$tag" -D packs -R "${{ github.repository }}"
      - run: python tools/build.py full packs
      - name: HTML판 올리기
        run: |
          cp "dist/감자편집기.html" "dist/PotatoEditor_${{ needs.check.outputs.tag }}_html.html"
          gh release upload "${{ needs.check.outputs.tag }}" "dist/PotatoEditor_${{ needs.check.outputs.tag }}_html.html" --clobber -R "${{ github.repository }}"
