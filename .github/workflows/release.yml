# 새 버전 내기: v로 시작하는 태그(예: v8.0.1)를 올리면 윈도우 설치 파일과 HTML판을 만들어 릴리스에 올려요
# 설치된 감자 편집기는 이 릴리스의 latest.json을 보고 업데이트해요
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: 업데이트 서명 키 확인
        id: key
        shell: bash
        env:
          K: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$K" ]; then echo "args=" >> "$GITHUB_OUTPUT"; else echo "args=--config src-tauri/nosign.json" >> "$GITHUB_OUTPUT"; echo "::warning::서명 키(TAURI_SIGNING_PRIVATE_KEY)가 없어서 자동 업데이트 파일 없이 만들어요"; fi
      - name: 릴리스 설명
        id: notes
        shell: bash
        run: |
          { echo 'body<<NOTES_EOF'; cat release-notes.md; echo; echo 'NOTES_EOF'; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 감자 편집기 ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          assetNamePattern: PotatoEditor_[version]_[arch][setup][ext]
          args: ${{ steps.key.outputs.args }}
  html:
    needs: windows
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 팩 받기
        run: |
          tag=$(grep -oE "CZ_PACK_TAG = '[^']+'" src/cz.js | cut -d"'" -f2)
          gh release download "$tag" -D packs -R "${{ github.repository }}"
      - run: python tools/build.py full packs
      - name: HTML판 올리기
        run: |
          cp "dist/감자편집기.html" "dist/PotatoEditor_${{ github.ref_name }}_html.html"
          gh release upload "${{ github.ref_name }}" "dist/PotatoEditor_${{ github.ref_name }}_html.html" --clobber -R "${{ github.repository }}"
