# 자동 흰칠 팩 만들기: main에 올라간 편집기가 쓰는 팩(src/cz.js의 CZ_PACK_TAG)이 아직 릴리스에 없으면
# 원본 모델을 받아 변환하고 그 이름의 릴리스(예: packs-1)에 올려요. 이미 있으면 아무것도 안 해요
name: packs
on:
  push:
    branches: [main]
    paths: ['tools/make_packs.py', 'tools/fp16*.py', 'src/cz.js', '.github/workflows/packs.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  packs:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 팩 이름 확인
        id: tag
        run: |
          tag=$(grep -oE "CZ_PACK_TAG = '[^']+'" src/cz.js | cut -d"'" -f2)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "$tag 릴리스가 이미 있어요"; fi
      - uses: actions/setup-python@v5
        if: steps.tag.outputs.skip != '1'
        with:
          python-version: '3.12'
      - if: steps.tag.outputs.skip != '1'
        run: pip install onnx==1.23.2 numpy
      - if: steps.tag.outputs.skip != '1'
        run: python tools/make_packs.py --out packs
      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.skip != '1'
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 자동 흰칠 팩 (${{ steps.tag.outputs.tag }})
          body: 감자 편집기가 자동 흰칠을 처음 쓸 때 받아 가는 모델 팩이에요. 직접 받을 필요는 없어요.
          prerelease: true
          make_latest: false
          files: packs/*
